name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduos
          POSTGRES_PASSWORD: eduos_ci
          POSTGRES_DB: eduos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eduos:eduos_ci@localhost:5432/eduos
      TEST_DATABASE_URL: postgresql://eduos:eduos_ci@localhost:5432/eduos_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-123456
      BETTER_AUTH_URL: http://localhost:3000
      EDUOS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
